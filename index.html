<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages for you, my love, I miss you so much.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN for Heart Bursts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        /* Glassmorphism Styles */
        .glass-card-square {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 16px 36px rgba(225, 112, 142, 0.16);
        }

        .glass-card-locked {
            background: rgba(255, 235, 240, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px dashed rgba(255, 255, 255, 0.5);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Ambient floating hearts keyframe */
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 0;
            animation: floatHeart 12s infinite linear;
        }

        /* iOS Scrollbar */
        .ios-scrollbar::-webkit-scrollbar { display: none; }
        .ios-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Pulsing Glow Animation for currently active card */
        @keyframes pulseGlowSquare {
            0%, 100% { box-shadow: 0 0 25px rgba(244, 114, 182, 0.5); border-color: rgba(244, 114, 182, 0.9); }
            50% { box-shadow: 0 0 40px rgba(244, 114, 182, 0.85); border-color: rgba(225, 29, 72, 1); }
        }

        .glow-unlocked-square {
            animation: pulseGlowSquare 2.5s infinite ease-in-out;
        }

        /* Modal Spring Animation */
        @keyframes springUp {
            0% { transform: scale(0.82) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .animate-spring {
            animation: springUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-100 to-red-100 min-h-screen text-slate-800 antialiased overflow-x-hidden selection:bg-rose-200">

    <!-- Floating Hearts Background Container -->
    <div id="heartsContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Main Full Mobile Screen Layout -->
    <div class="relative z-10 w-full max-w-md mx-auto min-h-screen flex flex-col justify-between px-3 py-6 sm:px-4">

        <!-- iOS Header Bar -->
        <header class="pt-2 pb-5 text-center px-2">
            <!-- Header Pill / Status Badge -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-pill shadow-sm mb-4 border border-white">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
                </span>
                <span id="progressText" class="text-sm font-bold text-rose-700 tracking-wide uppercase">1 of 9 Unlocked</span>
            </div>

            <!-- Header Main Title -->
            <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-600 via-pink-600 to-red-500 leading-tight mb-3 tracking-tight">
                Messeges for you, my love,<br/>I miss you so much.
            </h1>
            <p class="text-sm text-rose-700/80 font-semibold">Tap each square card to read & unlock the next love note 💕</p>

            <!-- Progress Bar -->
            <div class="w-full bg-rose-200/60 rounded-full h-3 mt-5 p-0.5 backdrop-blur-md border border-white/80">
                <div id="progressBar" class="bg-gradient-to-r from-pink-500 via-rose-500 to-red-500 h-2 rounded-full transition-all duration-500 ease-out" style="width: 11.11%;"></div>
            </div>
        </header>

        <!-- Schedule Full Square Cards Container -->
        <main class="my-2 flex-grow">
            <div id="cardsList" class="space-y-6 pb-8">
                <!-- Square cards populated here via JavaScript -->
            </div>
        </main>

        <!-- iOS Footer / Reset Controls -->
        <footer class="text-center py-6 border-t border-rose-200/50">
            <p class="text-sm text-rose-600 font-semibold mb-2">Made with all my heart for you 💖</p>
            <button onclick="resetProgress()" class="text-xs text-rose-400 hover:text-rose-600 transition-colors underline font-medium">
                Reset Progress (Start Over)
            </button>
        </footer>
    </div>

    <!-- iOS Glass Reader Modal -->
    <div id="messageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-rose-950/40 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="glass-modal w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-white/90 text-center transform scale-90 transition-transform duration-300">
            
            <!-- Modal Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-rose-100/90 hover:bg-rose-200 text-rose-600 flex items-center justify-center transition-colors shadow-sm">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>

            <!-- Modal Header Icon/Badge -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-400 text-white text-3xl mb-3 shadow-lg shadow-rose-500/30">
                <span id="modalEmoji">⚛️</span>
            </div>

            <!-- Modal Subtitle Tag -->
            <div id="modalPeriodTag" class="text-xs font-extrabold text-rose-500 tracking-wider uppercase mb-1">Period 1</div>
            <h3 id="modalSubject" class="text-2xl font-black text-slate-800 mb-4">Physics</h3>

            <!-- Romantic Message Body Container -->
            <div class="bg-white/70 rounded-2xl p-5 border border-rose-100 text-left mb-6 shadow-sm max-h-64 overflow-y-auto ios-scrollbar">
                <p id="modalBodyText" class="text-slate-800 text-base leading-relaxed whitespace-pre-line font-medium">
                    <!-- Dynamic Message Text -->
                </p>
            </div>

            <!-- Modal Footer Button -->
            <button onclick="closeModal()" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 text-white font-bold text-base shadow-xl shadow-rose-500/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                <span>Close & Continue</span>
                <i class="fa-solid fa-heart text-sm"></i>
            </button>
        </div>
    </div>

    <script>
        /**
         * =========================================================================
         * EASY CONFIGURATION: MESSAGES_CONFIG
         * Edit your 9 period messages, emojis, and icons right here!
         * =========================================================================
         */
        const MESSAGES_CONFIG = [
            {
                id: 1,
                periodName: "1. Physics",
                badge: "Period 1",
                timeTag: "8:00 AM",
                icon: "fa-atom",
                emoji: "⚛️",
                teaser: "Tap to reveal your Physics message...",
                note: "Good morning my love! While you're in Physics thinking about forces and gravity, remember that the strongest force in my world is the magnetic pull I feel towards you. Have a great first period! I miss you so much."
            },
            {
                id: 2,
                periodName: "2. Bio",
                badge: "Period 2",
                timeTag: "8:50 AM",
                icon: "fa-dna",
                emoji: "🧬",
                teaser: "Tap to reveal your Bio message...",
                note: "Biology period! They say the heart pumps blood through the body, but mine honestly just beats faster every time I think of your beautiful smile. Hope your class is super easy today, handsome/beautiful! 💕"
            },
            {
                id: 3,
                periodName: "3. Maths",
                badge: "Period 3",
                timeTag: "9:40 AM",
                icon: "fa-calculator",
                emoji: "📐",
                teaser: "Tap to reveal your Maths message...",
                note: "No equation in Math could ever express how much I love you. You + Me = My favorite place in the whole world. Hang in there, break time is right after this period!"
            },
            {
                id: 4,
                periodName: "4. Break",
                badge: "Break Time",
                timeTag: "10:30 AM",
                icon: "fa-mug-hot",
                emoji: "☕",
                teaser: "Tap to reveal your Break message...",
                note: "Yay! Break time! Go get a yummy snack, relax your mind, and take a deep breath. Wish I was there right now to hold your hand and share a snack with you. Missing you like crazy!"
            },
            {
                id: 5,
                periodName: "5. Free",
                badge: "Period 4",
                timeTag: "11:00 AM",
                icon: "fa-feather",
                emoji: "✨",
                teaser: "Tap to reveal your Free Period message...",
                note: "A free period! I hope you get to chill and take it easy. I'm probably daydreaming about our next date right now. Sending you the warmest hug across the distance!"
            },
            {
                id: 6,
                periodName: "6. Free",
                badge: "Period 5",
                timeTag: "11:50 AM",
                icon: "fa-cloud-sun",
                emoji: "☁️",
                teaser: "Tap to reveal your Free Period message...",
                note: "Another free period for you! Don't forget to stay hydrated and smile because someone out here is completely head over heels in love with you."
            },
            {
                id: 7,
                periodName: "7. Lunch",
                badge: "Lunch Break",
                timeTag: "12:40 PM",
                icon: "fa-utensils",
                emoji: "🍱",
                teaser: "Tap to reveal your Lunch message...",
                note: "Lunchtime! Make sure to eat a great meal, okay? I wish we were sitting together right now giggling and chatting. Eat well, my sweetheart!"
            },
            {
                id: 8,
                periodName: "8. Physics",
                badge: "Period 6",
                timeTag: "1:30 PM",
                icon: "fa-lightbulb",
                emoji: "💡",
                teaser: "Tap to reveal your Physics message...",
                note: "Physics again! Almost at the finish line for today. Just one more period after this and you're done! Thinking of you always brightens up my entire day."
            },
            {
                id: 9,
                periodName: "9. PE",
                badge: "Period 7",
                timeTag: "2:20 PM",
                icon: "fa-running",
                emoji: "🏃‍♂️️",
                teaser: "Tap to reveal your PE message...",
                note: "Last period: PE! Run fast, have fun, and burn off that school day stress! You did amazing today. I'm so proud of you, and I love you more than words can say! ❤️"
            }
        ];

        // Persistent Unlocked State
        let unlockedCount = parseInt(localStorage.getItem('unlockedMessagesCount') || '1');

        /**
         * STREAMING_CHUNK:Creating background floating heart particles...
         */
        function createAmbientHearts() {
            const container = document.getElementById('heartsContainer');
            const heartIcons = ['❤️', '💖', '💕', '💗', '🌸', '✨', '💘'];
            
            for (let i = 0; i < 16; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-2xl sm:text-3xl';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${8 + Math.random() * 10}s`;
                heart.style.animationDelay = `${Math.random() * 6}s`;
                container.appendChild(heart);
            }
        }

        /**
         * STREAMING_CHUNK:Rendering full-width square period cards...
         */
        function renderCards() {
            const cardsList = document.getElementById('cardsList');
            cardsList.innerHTML = '';

            MESSAGES_CONFIG.forEach((config, index) => {
                const isUnlocked = index < unlockedCount;
                const isNextToUnlock = index === unlockedCount - 1;

                const card = document.createElement('div');
                card.className = `w-full aspect-square rounded-3xl p-6 flex flex-col justify-between transition-all duration-300 transform active:scale-[0.97] cursor-pointer ${
                    isUnlocked 
                        ? 'glass-card-square ' + (isNextToUnlock ? 'glow-unlocked-square border-rose-500' : 'border-white')
                        : 'glass-card-locked opacity-75'
                }`;

                card.onclick = () => handleCardClick(index);

                card.innerHTML = `
                    <!-- Top Row: Badge & Time -->
                    <div class="flex items-center justify-between w-full">
                        <span class="text-xs font-extrabold px-3.5 py-1.5 rounded-full uppercase tracking-wider ${
                            isUnlocked ? 'bg-rose-500 text-white shadow-md shadow-rose-500/30' : 'bg-slate-300/80 text-slate-600'
                        }">
                            ${config.badge}
                        </span>
                        <span class="text-sm font-bold ${isUnlocked ? 'text-rose-700' : 'text-slate-400'} flex items-center gap-1.5">
                            <i class="fa-regular fa-clock text-xs"></i> ${config.timeTag}
                        </span>
                    </div>

                    <!-- Center Area: Big Giant Icon & Main Title -->
                    <div class="flex flex-col items-center justify-center text-center my-auto py-2">
                        <!-- Icon Circle Container -->
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mb-3 transition-transform ${
                            isUnlocked 
                                ? 'bg-gradient-to-tr from-rose-500 to-pink-400 text-white shadow-xl shadow-rose-400/40 text-4xl sm:text-5xl' 
                                : 'bg-slate-200/80 text-slate-400 text-3xl'
                        }">
                            ${isUnlocked ? `<i class="fa-solid ${config.icon}"></i>` : '<i class="fa-solid fa-lock"></i>'}
                        </div>

                        <!-- Period Title -->
                        <h2 class="text-2xl sm:text-3xl font-black ${isUnlocked ? 'text-slate-800' : 'text-slate-500'} tracking-tight">
                            ${config.periodName} ${isUnlocked ? config.emoji : ''}
                        </h2>

                        <!-- Subtitle Message Teaser -->
                        <p class="text-lg sm:text-xl font-handwriting mt-1 ${isUnlocked ? 'text-rose-600 font-bold' : 'text-slate-400'}">
                            ${isUnlocked ? 'Tap to open note 💌' : 'Locked • Open previous first'}
                        </p>
                    </div>

                    <!-- Bottom Action Bar inside Square -->
                    <div class="w-full text-center">
                        ${isUnlocked ? `
                            <div class="w-full py-2.5 rounded-2xl bg-white/80 border border-rose-200 text-rose-600 font-bold text-sm flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-solid fa-envelope-open text-base"></i>
                                <span>Read Message</span>
                            </div>
                        ` : `
                            <div class="w-full py-2.5 rounded-2xl bg-slate-200/50 border border-slate-300/40 text-slate-400 font-semibold text-xs flex items-center justify-center gap-2">
                                <i class="fa-solid fa-lock text-xs"></i>
                                <span>Complete Earlier Periods</span>
                            </div>
                        `}
                    </div>
                `;

                cardsList.appendChild(card);
            });

            // Update Header Progress
            document.getElementById('progressText').innerText = `${unlockedCount} of ${MESSAGES_CONFIG.length} Unlocked`;
            const progressPercent = (unlockedCount / MESSAGES_CONFIG.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
        }

        /**
         * STREAMING_CHUNK:Handling card clicks & card unlock progress logic...
         */
        function handleCardClick(index) {
            if (index < unlockedCount) {
                // Open message view modal
                const config = MESSAGES_CONFIG[index];
                document.getElementById('modalEmoji').innerText = config.emoji;
                document.getElementById('modalPeriodTag').innerText = config.badge + " • " + config.timeTag;
                document.getElementById('modalSubject').innerText = config.periodName;
                document.getElementById('modalBodyText').innerText = config.note;

                openModal();

                // Advance progression if opening the newest unlocked card
                if (index === unlockedCount - 1 && unlockedCount < MESSAGES_CONFIG.length) {
                    unlockedCount++;
                    localStorage.setItem('unlockedMessagesCount', unlockedCount.toString());
                    
                    // Trigger heart confetti celebration
                    triggerHeartConfetti();
                    
                    // Re-render square list to unlock the next card
                    setTimeout(renderCards, 450);
                }
            } else {
                // Bounce feedback on locked card
                shakeCard(index);
            }
        }

        /**
         * STREAMING_CHUNK:Adding animation modal controls & reset capabilities...
         */
        function triggerHeartConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 45,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f43f5e', '#ec4899', '#fb7185', '#fda4af']
                });
            }
        }

        function shakeCard(index) {
            const card = document.getElementById('cardsList').children[index];
            if (card) {
                card.classList.add('animate-bounce');
                setTimeout(() => card.classList.remove('animate-bounce'), 800);
            }
        }

        function openModal() {
            const modal = document.getElementById('messageModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.add('animate-spring');
        }

        function closeModal() {
            const modal = document.getElementById('messageModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('animate-spring');
        }

        function resetProgress() {
            if (confirm("Reset all unlocked messages back to Period 1?")) {
                unlockedCount = 1;
                localStorage.setItem('unlockedMessagesCount', '1');
                renderCards();
            }
        }

        // Initialize App on Window Load
        window.onload = function() {
            createAmbientHearts();
            renderCards();
        };
    </script>
</body>
</html>
