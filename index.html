<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages for you, my love, I miss you so much.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN for Heart Bursts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        /* Glassmorphism Styles */
        .glass-card-square {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-width: 2px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
        }

        .glass-card-locked {
            background: rgba(255, 235, 240, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px dashed rgba(255, 255, 255, 0.6);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        /* Ambient floating hearts keyframe */
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 0;
            animation: floatHeart 12s infinite linear;
        }

        /* iOS Scrollbar */
        .ios-scrollbar::-webkit-scrollbar { display: none; }
        .ios-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Pulsing Glow Animation for currently active card */
        @keyframes pulseGlowSquare {
            0%, 100% { box-shadow: 0 0 25px rgba(244, 114, 182, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(225, 29, 72, 0.8); transform: scale(1.01); }
        }

        .glow-unlocked-square {
            animation: pulseGlowSquare 2.5s infinite ease-in-out;
        }

        /* Modal Spring Animation */
        @keyframes springUp {
            0% { transform: scale(0.82) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .animate-spring {
            animation: springUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-100 to-red-100 min-h-screen text-slate-800 antialiased overflow-x-hidden selection:bg-rose-200">

    <!-- Floating Hearts Background Container -->
    <div id="heartsContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Main Full Mobile Screen Layout -->
    <div class="relative z-10 w-full max-w-md mx-auto min-h-screen flex flex-col justify-between px-3 py-6 sm:px-4">

        <!-- iOS Header Bar -->
        <header class="pt-2 pb-5 text-center px-2">
            <!-- Header Pill / Status Badge -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-pill shadow-sm mb-4 border border-white">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
                </span>
                <span id="progressText" class="text-sm font-extrabold text-rose-700 tracking-wide uppercase">1 of 10 Unlocked</span>
            </div>

            <!-- Header Main Title -->
            <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-600 via-pink-600 to-red-500 leading-tight mb-3 tracking-tight">
                Messeges for you, my love,<br/>I miss you so much.
            </h1>
            <p class="text-sm text-rose-700/80 font-semibold">Tap each card to read & unlock your next note 💕</p>

            <!-- Progress Bar -->
            <div class="w-full bg-rose-200/60 rounded-full h-3 mt-5 p-0.5 backdrop-blur-md border border-white/80">
                <div id="progressBar" class="bg-gradient-to-r from-pink-500 via-rose-500 to-red-500 h-2 rounded-full transition-all duration-500 ease-out" style="width: 10%;"></div>
            </div>
        </header>

        <!-- Schedule Full Square Cards Container -->
        <main class="my-2 flex-grow">
            <div id="cardsList" class="space-y-6 pb-8">
                <!-- Square cards populated dynamically via JS -->
            </div>
        </main>

        <!-- iOS Footer / Reset Controls -->
        <footer class="text-center py-6 border-t border-rose-200/50">
            <p class="text-sm text-rose-600 font-semibold mb-2">Made with all my heart for you 💖</p>
            <button onclick="resetProgress()" class="text-xs text-rose-400 hover:text-rose-600 transition-colors underline font-medium">
                Reset Progress (Start Over)
            </button>
        </footer>
    </div>

    <!-- iOS Glass Reader Modal -->
    <div id="messageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-rose-950/40 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="glass-modal w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-white/90 text-center transform scale-90 transition-transform duration-300">
            
            <!-- Modal Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-rose-100/90 hover:bg-rose-200 text-rose-600 flex items-center justify-center transition-colors shadow-sm">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>

            <!-- Modal Header Icon/Badge -->
            <div id="modalIconContainer" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl text-white text-3xl mb-3 shadow-lg">
                <span id="modalEmoji">🏫</span>
            </div>

            <!-- Modal Subtitle Tag -->
            <div id="modalPeriodTag" class="text-xs font-extrabold tracking-wider uppercase mb-1">8:10 AM</div>
            <h3 id="modalSubject" class="text-2xl font-black text-slate-800 mb-4">Arrived at school / Form</h3>

            <!-- Romantic Message Body Container -->
            <div class="bg-white/80 rounded-2xl p-5 border border-rose-100 text-left mb-6 shadow-sm max-h-64 overflow-y-auto ios-scrollbar">
                <p id="modalBodyText" class="text-slate-800 text-base leading-relaxed whitespace-pre-line font-medium">
                    <!-- Dynamic Message Text -->
                </p>
            </div>

            <!-- Modal Footer Button -->
            <button id="modalActionButton" onclick="closeModal()" class="w-full py-3.5 px-6 rounded-2xl text-white font-bold text-base shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2">
                <span>Close & Continue</span>
                <i class="fa-solid fa-heart text-sm"></i>
            </button>

    </div>

        // Persistent Unlocked State
        let unlockedCount = parseInt(localStorage.getItem('unlockedMessagesCount') || '1');

        /**
         * STREAMING_CHUNK:Creating ambient floating particles...
         */
        function createAmbientHearts() {
            const container = document.getElementById('heartsContainer');
            const heartIcons = ['❤️', '💖', '💕', '💗', '🌸', '✨', '💘'];
            
            for (let i = 0; i < 16; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-2xl sm:text-3xl';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${8 + Math.random() * 10}s`;
                heart.style.animationDelay = `${Math.random() * 6}s`;
                container.appendChild(heart);
            }
        }

        /**
         * STREAMING_CHUNK:Rendering full square cards and End of Day banner...
         */
        function renderCards() {
            const cardsList = document.getElementById('cardsList');
            cardsList.innerHTML = '';

            // Render the 10 Message Periods
            MESSAGES_CONFIG.forEach((config, index) => {
                const isUnlocked = index < unlockedCount;
                const isNextToUnlock = index === unlockedCount - 1;

                const card = document.createElement('div');
                card.className = `w-full aspect-square rounded-3xl p-6 flex flex-col justify-between transition-all duration-300 transform active:scale-[0.97] cursor-pointer ${
                    isUnlocked 
                        ? `${config.cardBg} ${config.borderColor} glass-card-square ` + (isNextToUnlock ? 'glow-unlocked-square' : '')
                        : 'glass-card-locked opacity-75'
                }`;

                card.onclick = () => handleCardClick(index);

                card.innerHTML = `
                    <!-- Top Row: Badge & Time -->
                    <div class="flex items-center justify-between w-full">
                        <span class="text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-wider ${
                            isUnlocked ? `${config.badgeBg} ${config.badgeText} shadow-md` : 'bg-slate-300/80 text-slate-600'
                        }">
                            ${config.badge}
                        </span>
                        <span class="text-base font-extrabold ${isUnlocked ? config.accentText : 'text-slate-400'} flex items-center gap-1.5">
                            <i class="fa-regular fa-clock text-xs"></i> ${config.timeTag}
                        </span>
                    </div>

                    <!-- Center Area: Icon & Subject Title -->
                    <div class="flex flex-col items-center justify-center text-center my-auto py-2">
                        <!-- Icon Circle -->
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mb-3 transition-transform ${
                            isUnlocked 
                                ? `${config.iconGradient} text-white shadow-xl text-4xl sm:text-5xl` 
                                : 'bg-slate-200/80 text-slate-400 text-3xl'
                        }">
                            ${isUnlocked ? `<i class="fa-solid ${config.icon}"></i>` : '<i class="fa-solid fa-lock"></i>'}
                        </div>

                        <!-- Period Title -->
                        <h2 class="text-2xl sm:text-3xl font-black ${isUnlocked ? 'text-slate-900' : 'text-slate-500'} tracking-tight">
                            ${config.periodName} ${isUnlocked ? config.emoji : ''}
                        </h2>

                        <!-- Subtitle Teaser -->
                        <p class="text-xl sm:text-2xl font-handwriting mt-1 ${isUnlocked ? `${config.accentText} font-bold` : 'text-slate-400'}">
                            ${isUnlocked ? 'Tap to open note 💌' : 'Locked • Read previous note first'}
                        </p>
                    </div>

                    <!-- Bottom Action Button -->
                    <div class="w-full text-center">
                        ${isUnlocked ? `
                            <div class="w-full py-3 rounded-2xl bg-white/90 border ${config.borderColor} ${config.accentText} font-extrabold text-sm flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-solid fa-envelope-open text-base"></i>
                                <span>Read Message</span>
                            </div>
                        ` : `
                            <div class="w-full py-3 rounded-2xl bg-slate-200/50 border border-slate-300/40 text-slate-400 font-semibold text-xs flex items-center justify-center gap-2">
                                <i class="fa-solid fa-lock text-xs"></i>
                                <span>Complete Earlier Periods</span>
                            </div>
                        `}
                    </div>
                `;

                cardsList.appendChild(card);
            });

            // Item 11: END OF DAY Banner
            const allUnlocked = unlockedCount > MESSAGES_CONFIG.length;
            const endOfDayCard = document.createElement('div');
            endOfDayCard.className = `w-full rounded-3xl p-6 flex flex-col items-center justify-center text-center border-2 transition-all duration-500 ${
                allUnlocked 
                    ? 'bg-gradient-to-br from-amber-200 via-rose-200 to-purple-200 border-amber-400 shadow-2xl scale-100' 
                    : 'bg-slate-200/40 border-slate-300/50 opacity-60'
            }`;

            endOfDayCard.innerHTML = `
                <div class="w-16 h-16 rounded-full flex items-center justify-center mb-3 ${allUnlocked ? 'bg-gradient-to-tr from-amber-500 to-rose-500 text-white shadow-lg text-3xl' : 'bg-slate-300 text-slate-500 text-2xl'}">
                    ${allUnlocked ? '🌟' : '🌙'}
                </div>
                <h3 class="text-2xl sm:text-3xl font-black ${allUnlocked ? 'text-slate-900' : 'text-slate-500'}">
                    END OF DAY
                </h3>
                <p class="text-base font-bold ${allUnlocked ? 'text-rose-700' : 'text-slate-400'} mt-1">
                    ${allUnlocked ? 'You finished all your classes! 🎉 I love you so much!' : 'Complete all period notes to finish the day!'}
                </p>
            `;
            cardsList.appendChild(endOfDayCard);

            // Update Progress Header
            const displayCount = Math.min(unlockedCount, MESSAGES_CONFIG.length);
            document.getElementById('progressText').innerText = `${displayCount} of 10 Unlocked`;
            const progressPercent = (displayCount / MESSAGES_CONFIG.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
        }

        /**
         * STREAMING_CHUNK:Card click handling & modal logic...
         */
        function handleCardClick(index) {
            if (index < unlockedCount) {
                const config = MESSAGES_CONFIG[index];
                
                // Update Modal Content & Colors
                document.getElementById('modalEmoji').innerText = config.emoji;
                document.getElementById('modalPeriodTag').innerText = config.badge + " • " + config.timeTag;
                document.getElementById('modalPeriodTag').className = `text-xs font-black tracking-wider uppercase mb-1 ${config.accentText}`;
                document.getElementById('modalSubject').innerText = config.periodName;
                document.getElementById('modalBodyText').innerText = config.note;

                const modalIcon = document.getElementById('modalIconContainer');
                modalIcon.className = `inline-flex items-center justify-center w-16 h-16 rounded-2xl text-white text-3xl mb-3 shadow-lg ${config.iconGradient}`;

                const modalBtn = document.getElementById('modalActionButton');
                modalBtn.className = `w-full py-3.5 px-6 rounded-2xl text-white font-bold text-base shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2 ${config.buttonBg}`;

                openModal();

                // Unlock next period card
                if (index === unlockedCount - 1 && unlockedCount <= MESSAGES_CONFIG.length) {
                    unlockedCount++;
                    localStorage.setItem('unlockedMessagesCount', unlockedCount.toString());
                    
                    triggerHeartConfetti();
                    setTimeout(renderCards, 450);
                }
            } else {
                shakeCard(index);
            }
        }

        /**
         * STREAMING_CHUNK:Animations and modal helper controls...
         */
        function triggerHeartConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#f43f5e', '#ec4899', '#fb7185', '#3b82f6', '#10b981', '#f59e0b']
                });
            }
        }

        function shakeCard(index) {
            const card = document.getElementById('cardsList').children[index];
            if (card) {
                card.classList.add('animate-bounce');
                setTimeout(() => card.classList.remove('animate-bounce'), 800);
            }
        }

        function openModal() {
            const modal = document.getElementById('messageModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.add('animate-spring');
        }

        function closeModal() {
            const modal = document.getElementById('messageModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('animate-spring');
        }

        function resetProgress() {
            if (confirm("Reset all unlocked notes back to Arrived at school / Form?")) {
                unlockedCount = 1;
                localStorage.setItem('unlockedMessagesCount', '1');
                renderCards();
            }
        }
